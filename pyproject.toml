[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "novos-classicos-lab"
version = "0.1.0"
description = "Fundação de engenharia do Novos Clássicos Persona Lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.15.11,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novos_classicos_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
